[package]
name = "cryptocompass-companion"
version = "0.1.6"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cryptocompass_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order, because a session log is a relay's output: a frame's fields
# come out in the order the game sent them rather than sorted. It also puts
# the header's own keys in session.py's order, which is the format we copy.
serde_json = { version = "1", features = ["preserve_order"] }
# The async runtime Tauri already pulls in, named here so the listener does not
# rest on a transitive dependency staying where it is. `sync` is the sender's
# queue waking its own task.
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
# RFC 6455, both halves: the server the game dials, and the client that dials
# the collector. Hand-rolling a handshake would be worse than the Python side's
# minimal one, which exists only because that project is stdlib-only.
#
# native-tls, because the collector is behind wss and without a TLS feature
# `connect_async` refuses the url before it reaches the network - which the
# sender cannot tell from a collector that is down, and so retries forever
# saying nothing. The system's own TLS rather than a bundled one: schannel on
# Windows, so the machine's trust store and its policies apply and the build
# needs nothing installed.
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
# The stream and sink combinators tungstenite hands back.
futures-util = "0.3"
# Timestamps in the shape session.py writes them - ISO 8601, milliseconds, Z.
# Hand-rolling a civil calendar to match a format we do not own would be a bug
# hunt for nothing; chrono is already in the tree behind Tauri.
chrono = { version = "0.4", default-features = false, features = ["now", "std"] }
# gzip on close, because `.jsonl.gz` is the name replay.py looks for.
flate2 = "1"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"

[dev-dependencies]
# The session tests write real files. The format is bytes on disk, so a fake
# filesystem would test something other than the thing that ships.
tempfile = "3"

